name: Validar Fase II
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir y probar contenedor
        run: bash validar_docker.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencias-docker
          path: evidencias/
